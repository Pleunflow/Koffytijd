services:
  postgres:
    image: postgres:16-alpine
    container_name: koffytijd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: koffy
      POSTGRES_PASSWORD: koffy
      POSTGRES_DB: koffytijd
    ports:
      - "5432:5432"
    volumes:
      - koffytijd-data:/var/lib/postgresql/data
      # Maakt bij de eerste start ook de testdatabase aan (voor `pnpm test`).
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koffy -d koffytijd"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  koffytijd-data:
